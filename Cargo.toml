[package]
name = "rs-smarttcp"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "IOWN/APN(光電融合ネットワーク)×Smart-TCP(AI生成通信プロトコル)に着想を得た、実測RTT/ジッターに基づく適応制御ライブラリ(決定論的ヒューリスティック、arXiv論文のSmart-TCPプロトコル自体の実装ではない)"
repository = "https://github.com/aon-co-jp/RS-SmartTCP"

[lib]
name = "rs_smarttcp"
path = "src/lib.rs"

[dependencies]
chacha20poly1305 = "0.11.0"
open_raid_z_core = { version = "0.0.1", path = "../open-raid-z/open_runo_zfs_source/open_raid_z_core", default-features = false }
rand = "0.10.2"
rcgen = { version = "0.14.9", features = ["x509-parser"] }

# zfs_accel_hlslの既定feature("gpu")はWindows専用のD3D12/DirectML
# (`windows`クレート)に依存する上、ビルド時に`dxc`(DirectX Shader
# Compiler、Windows SDK/Vulkan SDK同梱)を要求する。
# **正直な開示・2段階で発覚した問題**: (1) 2026-08-11、
# open-englishのAndroidクロスコンパイルで、Windows以外のターゲットでは
# そもそも`windows`クレートがコンパイルできず失敗(→ターゲット別の
# 依存分離で対応)。(2) 同日、open-englishのWindows向けGitHub Actions
# CI(`windows-latest`ランナー)には`dxc`が入っておらず、Windows
# ターゲットでも`gpu`feature既定有効のままではビルド不能と判明——
# `open-raid-z`自身の release.yml が全く同じ理由でWindows CI上でも
# `--no-default-features`(`gpu_accel`無効・CPUフォールバックのみ)を
# 選んでいる既存の方針と同じ判断に揃え、`rs-smarttcp`側もOS問わず
# 常に`default-features = false`とした(実際のGPU/NPUアクセラレーション
# を使いたい場合は、`dxc`/Windows SDKが揃ったローカル開発機上で
# 個別に`gpu`featureを有効化してビルドすること)。
# `raid_bridge.rs`のdetect_parity_acceleratorは`gpu`/`vulkan`いずれの
# featureも無効な場合、常にCPUフォールバックを返す設計のため、この
# 変更でコンパイルエラーにはならない(既存のzfs_accel_hlsl::device::
# detect_best_acceleratorの実装通り)。
[dependencies.zfs_accel_hlsl]
version = "0.0.1"
path = "../open-raid-z/open_runo_zfs_source/zfs_accel_hlsl"
default-features = false
